<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusicStream — My Music</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f14;--surface:#161a23;--surface2:#1e2330;--border:#2a2f3d;
  --accent:#7c6af7;--text:#e8eaf0;--muted:#7a7f94;
  --error:#e05c6a;--success:#4cbb8a;--radius:12px;
}
body{font-family:'DM Sans',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── Header ── */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 32px;background:var(--surface);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:10;gap:14px;flex-wrap:wrap;
}
.logo{font-family:'DM Serif Display',serif;font-size:1.4rem}
.logo span{color:var(--accent)}
.user-area{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.username em{color:var(--accent);font-style:normal}
.backend-select{
  background:var(--bg);border:1px solid var(--border);
  border-radius:8px;color:var(--text);padding:7px 10px;
  cursor:pointer;font-family:inherit;transition:border-color 0.2s;
}
.backend-select:hover{border-color:var(--accent)}
.logout-btn{
  color:var(--muted);font-size:.85rem;cursor:pointer;
  border:1px solid var(--border);border-radius:6px;
  padding:7px 16px;background:none;font-family:inherit;
  transition:all 0.2s;
}
.logout-btn:hover{color:var(--error);border-color:var(--error)}

/* ── Layout ── */
.layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:28px 32px;max-width:1400px;margin:0 auto}
@media(max-width:900px){.layout{grid-template-columns:1fr;padding:18px}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panel-title{font-family:'DM Serif Display',serif;font-size:1.25rem;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.panel-title span{color:var(--accent)}

/* ── Query form ── */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:600px){.fields{grid-template-columns:1fr}}
.field-group label{display:block;font-size:.75rem;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.field-group input{
  width:100%;background:var(--bg);border:1.5px solid var(--border);
  border-radius:8px;color:var(--text);font-size:.9rem;
  padding:10px 12px;outline:none;font-family:inherit;
  transition:border-color 0.2s,box-shadow 0.2s;
}
.field-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,106,247,0.12)}

/* ── Query button ── */
.query-btn{
  width:100%;background:var(--accent);color:#fff;border:none;
  border-radius:8px;font-size:.95rem;font-weight:600;
  padding:12px;cursor:pointer;font-family:inherit;
  transition:all 0.25s;
  display:flex;align-items:center;justify-content:center;gap:10px;
  position:relative;overflow:hidden;
}
.query-btn::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);transition:left 0.4s ease}
.query-btn:hover:not(:disabled)::after{left:150%}
.query-btn:hover:not(:disabled){background:#6a58e8;box-shadow:0 4px 15px rgba(124,106,247,0.35);transform:translateY(-1px)}
.query-btn:active:not(:disabled){transform:scale(0.98);box-shadow:none}
.query-btn:disabled{opacity:0.7;cursor:not-allowed;transform:none}
.query-btn.loading{background:#5a4ed1}

/* ── Spinner ── */
.spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;display:none;flex-shrink:0}
.query-btn.loading .spinner{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Song list ── */
.song-list{display:flex;flex-direction:column;gap:10px;margin-top:16px;max-height:600px;overflow-y:auto;padding-right:4px}
.song-list::-webkit-scrollbar{width:4px}
.song-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ── Song card ── */
.song-card{
  display:flex;align-items:center;gap:14px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;
  animation:cardIn 0.2s ease;
  transition:border-color 0.2s;
}
.song-card:hover{border-color:rgba(124,106,247,0.3)}
@keyframes cardIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.song-img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--border);flex-shrink:0}
.song-info{flex:1;min-width:0}
.song-title{font-weight:500;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-meta{font-size:.8rem;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Action buttons ── */
.action-btn{
  flex-shrink:0;border:none;border-radius:7px;
  font-size:.8rem;font-weight:500;padding:7px 14px;
  cursor:pointer;transition:all 0.2s;font-family:inherit;
}
.action-btn:disabled{opacity:0.6;cursor:not-allowed}
.sub-btn{background:var(--accent);color:#fff}
.sub-btn:hover:not(:disabled){background:#6a58e8;box-shadow:0 3px 10px rgba(124,106,247,0.3);transform:translateY(-1px)}
.sub-btn:active:not(:disabled){transform:scale(0.96)}
.rem-btn{background:rgba(224,92,106,.15);color:var(--error);border:1px solid rgba(224,92,106,.3)}
.rem-btn:hover:not(:disabled){background:rgba(224,92,106,.25);transform:translateY(-1px)}
.rem-btn:active:not(:disabled){transform:scale(0.96)}

/* ── Status messages ── */
.status{font-size:.87rem;margin-top:12px;padding:10px 14px;border-radius:8px;display:none;animation:fadeIn 0.2s ease}
.status.error{background:rgba(224,92,106,.1);border:1px solid rgba(224,92,106,0.3);color:var(--error)}
.status.info{background:rgba(124,106,247,.1);border:1px solid rgba(124,106,247,0.3);color:var(--accent)}
.status.success{background:rgba(76,187,138,.1);border:1px solid rgba(76,187,138,0.3);color:var(--success)}

/* ── Empty and loading states ── */
.empty-msg{color:var(--muted);font-size:.88rem;text-align:center;padding:32px 0}
.loading-msg{color:var(--muted);font-size:.88rem;text-align:center;padding:20px 0;display:none}
.loading-dots::after{content:'...';animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%,20%{content:'.'}40%{content:'..'}60%,100%{content:'...'}}

/* ── Autocomplete suggestions ── */
.autocomplete-wrap{position:relative}
.suggestions{
  position:absolute;top:100%;left:0;right:0;
  background:var(--surface2);
  border:1px solid var(--accent);
  border-radius:0 0 8px 8px;
  max-height:180px;overflow-y:auto;
  z-index:999;display:none;
  box-shadow:0 8px 24px rgba(0,0,0,0.4);
}
.suggestions::-webkit-scrollbar{width:4px}
.suggestions::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.suggestion-item{
  padding:9px 14px;font-size:.88rem;cursor:pointer;
  transition:background 0.15s;color:var(--text);
  border-bottom:1px solid var(--border);
}
.suggestion-item:last-child{border-bottom:none}
.suggestion-item:hover,.suggestion-item.active{
  background:var(--accent);color:#fff;
}
.suggestion-highlight{font-weight:600}
</style>
</head>

<script>
// ── API URLs ──────────────────────────────────────────
const API_URLS = {
  lambda: "https://eiyhsu4a21.execute-api.us-east-1.amazonaws.com/prod",
  ecs:    "http://music-alb-494250144.us-east-1.elb.amazonaws.com",
  ec2:    "http://ec2-54-167-187-74.compute-1.amazonaws.com"
};

// ── Session guard ─────────────────────────────────────
const EMAIL = sessionStorage.getItem("email");
const UNAME = sessionStorage.getItem("user_name");

//Redirect immediately if not logged in
if (!EMAIL) {
    window.location.replace("login.html");
}

// Block browser back button after logout
// Push a new state so back button triggers popstate
history.pushState(null, null, window.location.href);
window.addEventListener("popstate", function() {
    // If user presses back, check session again
    if (!sessionStorage.getItem("email")) {
        window.location.replace("login.html");
    } else {
        // Stay on page - push state again to keep blocking
        history.pushState(null, null, window.location.href);
    }
});

// Check session every 2 seconds
// Catches edge cases like tab duplication after logout
const sessionCheck = setInterval(function() {
    if (!sessionStorage.getItem("email")) {
        clearInterval(sessionCheck);
        window.location.replace("login.html");
    }
}, 2000);

document.getElementById("displayName").textContent = UNAME || EMAIL;

// ── Track subscribed songs (persists across search/refresh) ──
// Stores song_id of every subscribed song so we can
// mark Subscribe buttons as already subscribed after refresh
const subscribedIds = new Set();

// ── Backend selector ──────────────────────────────────
const backendSelect = document.getElementById("backend");
backendSelect.value = sessionStorage.getItem("backend") || "lambda";
function getApiBase() { return API_URLS[backendSelect.value]; }

function backendChanged() {
  sessionStorage.setItem("backend", backendSelect.value);
  document.getElementById("queryList").innerHTML = "";
  document.getElementById("queryStatus").style.display = "none";
  loadSubscriptions();
  showStatus("queryStatus", "Switched to " + backendSelect.value.toUpperCase() + ". Subscriptions reloaded.", "info");
}

// ── Logout ────────────────────────────────────────────
function logout() {
  const b = sessionStorage.getItem("backend") || "lambda";
  sessionStorage.clear();
  sessionStorage.setItem("backend", b);
  clearInterval(sessionCheck);
  // Use replace() so back button cannot return to main page
  window.location.replace("login.html");
}

// ── Status messages ───────────────────────────────────
function showStatus(id, msg, type) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className   = `status ${type}`;
  el.style.display = "block";
}

// ── Query button loading ──────────────────────────────
function setQueryLoading(on) {
  const btn = document.getElementById("queryBtn");
  btn.disabled = on;
  btn.classList.toggle("loading", on);
  btn.querySelector(".btn-text").textContent = on ? "Searching..." : "Query";
}

// ── Normalise song from any backend format ────────────
function normaliseSong(raw) {
  const s         = raw || {};
  const title     = s.title     || s.song_title || "";
  const artist    = s.artist    || "";
  const album     = s.album     || "";
  const year      = s.year      ? String(s.year) : "";
  const image_url = s.image_url || s.img_url || s.image || "";
  const song_id   = s.song_id   || s.id || `${title}#${artist}#${album}`;
  return { ...s, title, artist, album, year, image_url, song_id };
}

// ── Extract array from any backend response ───────────
function extractArray(data) {
  if (Array.isArray(data))                         return data;
  if (Array.isArray(data.data))                    return data.data;
  if (Array.isArray(data.songs))                   return data.songs;
  if (Array.isArray(data.subscriptions))           return data.subscriptions;
  if (data.data && Array.isArray(data.data.songs)) return data.data.songs;
  return [];
}

// ── Build song card ───────────────────────────────────
function makeSongCard(rawSong, mode) {
  const song = normaliseSong(rawSong);
  const card = document.createElement("div");
  card.className = "song-card";
  card._song = song;
  const btn = mode === "subscribe"
    ? `<button class="action-btn sub-btn" onclick="subscribe(this)">Subscribe</button>`
    : `<button class="action-btn rem-btn"  onclick="removeSub(this)">Remove</button>`;
  card.innerHTML = `
    <img class="song-img"
         src="${song.image_url || 'https://via.placeholder.com/52'}"
         alt="${song.artist}"
         onerror="this.src='https://via.placeholder.com/52'">
    <div class="song-info">
      <div class="song-title">${song.title  || 'Untitled'}</div>
      <div class="song-meta">${song.artist  || 'Unknown'} · ${song.album || 'Unknown album'} · ${song.year || ''}</div>
    </div>${btn}`;
  return card;
}

// ── Load subscriptions ────────────────────────────────
async function loadSubscriptions() {
  const list    = document.getElementById("subList");
  const empty   = document.getElementById("subEmpty");
  const loading = document.getElementById("subLoading");
  list.innerHTML    = "";
  empty.style.display   = "none";
  loading.style.display = "block";
  try {
    const res   = await fetch(`${getApiBase()}/subscriptions/${encodeURIComponent(EMAIL)}`);
    const data  = await res.json();
    const songs = extractArray(data);
    loading.style.display = "none";
    // Store all subscribed song IDs so query results
    // can check and show "✓ Subscribed" instead of "Subscribe"
    subscribedIds.clear();
    songs.forEach(s => subscribedIds.add(normaliseSong(s).song_id));
    if (songs.length === 0) { empty.style.display = "block"; return; }
    for (const song of songs) list.appendChild(makeSongCard(song, "remove"));
  } catch (e) {
    loading.style.display = "none";
    empty.textContent     = "Could not load subscriptions. Check backend/CORS.";
    empty.style.display   = "block";
  }
}

// ── Query songs ───────────────────────────────────────
async function doQuery() {
  const title  = document.getElementById("qTitle").value.trim();
  const artist = document.getElementById("qArtist").value.trim();
  const year   = document.getElementById("qYear").value.trim();
  const album  = document.getElementById("qAlbum").value.trim();
  const list   = document.getElementById("queryList");
  list.innerHTML = "";
  document.getElementById("queryStatus").style.display = "none";

  // ── At least one field required ───────────────────
  if (!title && !artist && !year && !album) {
    showStatus("queryStatus", "Please fill in at least one field.", "error");
    return;
  }

  // ── Validate year format ──────────────────────────
  if (year) {
    if (!/^\d{4}$/.test(year)) {
      showStatus("queryStatus", "Year must be a 4-digit number (e.g. 2008).", "error");
      document.getElementById("qYear").style.borderColor = "var(--error)";
      return;
    }
    if (!VALID_YEARS.includes(year)) {
      showStatus("queryStatus", `No songs found for year ${year}. Valid years range from 1957 to 2021.`, "error");
      document.getElementById("qYear").style.borderColor = "var(--error)";
      return;
    }
    document.getElementById("qYear").style.borderColor = "";
  }

  // ── Case-insensitive resolve for ALL fields ─────────
  // Title — find correct casing
  let resolvedTitle = title;
  if (title) {
    const matchTitle = VALID_TITLES.find(
      t => t.toLowerCase() === title.toLowerCase()
    );
    if (matchTitle) resolvedTitle = matchTitle;
  }

  // Artist — find correct casing
  let resolvedArtist = artist;
  if (artist) {
    const matchArtist = VALID_ARTISTS.find(
      a => a.toLowerCase() === artist.toLowerCase()
    );
    if (matchArtist) resolvedArtist = matchArtist;
  }

  // Album — find correct casing
  let resolvedAlbum = album;
  if (album) {
    const matchAlbum = VALID_ALBUMS.find(
      a => a.toLowerCase() === album.toLowerCase()
    );
    if (matchAlbum) resolvedAlbum = matchAlbum;
  }

  setQueryLoading(true);
  const params = new URLSearchParams();
  if (resolvedArtist) params.set("artist", resolvedArtist);
  if (resolvedAlbum)  params.set("album",  resolvedAlbum);
  if (resolvedTitle)  params.set("title",  resolvedTitle);
  if (year)           params.set("year",   year);

  try {
    const res   = await fetch(`${getApiBase()}/songs?${params.toString()}`);
    const data  = await res.json();
    const songs = extractArray(data);
    setQueryLoading(false);
    if (songs.length === 0) {
      showStatus("queryStatus", "No result is retrieved. Please query again.", "info");
      return;
    }
    for (const song of songs) {
      const card = makeSongCard(song, "subscribe");
      const s    = normaliseSong(song);
      // If already subscribed show green button that does NOTHING
      if (subscribedIds.has(s.song_id)) {
        const btn = card.querySelector(".action-btn");
        if (btn) {
          btn.textContent      = "✓ Subscribed";
          btn.style.background = "#2d7a4f";
          btn.style.cursor     = "default";
          btn.style.boxShadow  = "none";
          btn.style.transform  = "none";
          btn.style.pointerEvents = "none";
          btn.disabled         = true;      
          btn.onclick          = null;      
        }
      }
      list.appendChild(card);
    }
  } catch (e) {
    setQueryLoading(false);
    showStatus("queryStatus", "Query failed. Check backend/CORS.", "error");
  }
}

// ── Subscribe ─────────────────────────────────────────
async function subscribe(btn) {
  const card = btn.closest(".song-card");
  const song = normaliseSong(card._song);
  btn.disabled    = true;
  btn.textContent = "...";
  try {
    const res = await fetch(`${getApiBase()}/subscriptions`, {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email:     EMAIL,
        song_id:   song.song_id,
        title:     song.title,
        artist:    song.artist,
        album:     song.album,
        year:      song.year,
        image_url: song.image_url
      })
    });
    if (res.ok) {
      // Add to subscription panel
      document.getElementById("subEmpty").style.display = "none";
      document.getElementById("subList").prepend(makeSongCard(song, "remove"));
      // Track this song as subscribed
      subscribedIds.add(song.song_id);
      // Show green Subscribed button - block all clicks
      btn.textContent           = "✓ Subscribed";
      btn.style.background      = "#2d7a4f";
      btn.style.cursor          = "default";
      btn.style.transform       = "none";
      btn.style.boxShadow       = "none";
      btn.style.pointerEvents   = "none"; 
      btn.disabled              = true;   
      btn.onclick               = null;   
    } else {
      btn.disabled    = false;
      btn.textContent = "Subscribe";
    }
  } catch (e) {
    btn.disabled    = false;
    btn.textContent = "Subscribe";
  }
}

// ── Remove subscription ───────────────────────────────
async function removeSub(btn) {
  const card = btn.closest(".song-card");
  const song = normaliseSong(card._song);
  btn.disabled    = true;
  btn.textContent = "...";
  try {
    const res = await fetch(`${getApiBase()}/subscriptions`, {
      method:  "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email:   EMAIL,
        song_id: song.song_id,
        title:   song.title,
        artist:  song.artist,
        album:   song.album
      })
    });
    if (res.ok) {
      // Animate card out then remove
      card.style.transition = "opacity 0.25s, transform 0.25s";
      card.style.opacity    = "0";
      card.style.transform  = "translateX(-10px)";
      setTimeout(() => {
        card.remove();
        if (document.getElementById("subList").children.length === 0) {
          document.getElementById("subEmpty").style.display = "block";
        }
      }, 250);

      // Remove from tracking set so subscribe button resets
      subscribedIds.delete(song.song_id);
      // Reset matching Subscribe button in query results
      const queryList = document.getElementById("queryList");
      for (const c of queryList.children) {
        const s = normaliseSong(c._song || {});
        if (s.song_id === song.song_id) {
          const qBtn = c.querySelector(".action-btn");
          if (qBtn) {
            qBtn.disabled              = false;
            qBtn.textContent           = "Subscribe";
            qBtn.style.background      = "";
            qBtn.style.cursor          = "pointer";
            qBtn.style.pointerEvents   = "auto"; // ✅ re-enable clicks
            qBtn.onclick               = function() { subscribe(qBtn); };
          }
          break;
        }
      }
    } else {
      btn.disabled    = false;
      btn.textContent = "Remove";
    }
  } catch (e) {
    btn.disabled    = false;
    btn.textContent = "Remove";
  }
}

// ── Autocomplete functions ────────────────────────────
let activeIndex = -1;

function showSuggestions(inputId, sugId, dataList) {
  const input = document.getElementById(inputId);
  const sug   = document.getElementById(sugId);
  const val   = input.value.trim().toLowerCase();
  activeIndex = -1;

  if (!val || val.length < 1) { sug.style.display = "none"; return; }

  // Filter matching items (case-insensitive contains)
  const matches = dataList.filter(item =>
    item.toLowerCase().includes(val)
  ).slice(0, 8); // show max 8 suggestions

  if (matches.length === 0) { sug.style.display = "none"; return; }

  // Build suggestion items with highlighted match
  sug.innerHTML = matches.map(item => {
    const idx   = item.toLowerCase().indexOf(val);
    const before = item.slice(0, idx);
    const match  = item.slice(idx, idx + val.length);
    const after  = item.slice(idx + val.length);
    return `<div class="suggestion-item"
      onmousedown="selectSuggestion('${inputId}','${sugId}','${item.replace(/'/g, "\'")}')">${before}<span class="suggestion-highlight">${match}</span>${after}</div>`;
  }).join('');

  sug.style.display = "block";
}

function selectSuggestion(inputId, sugId, value) {
  document.getElementById(inputId).value = value;
  document.getElementById(sugId).style.display = "none";
  activeIndex = -1;
  // Reset border color
  document.getElementById(inputId).style.borderColor = "";
}

function hideSuggestions(sugId) {
  // Small delay so click on suggestion fires first
  setTimeout(() => {
    const el = document.getElementById(sugId);
    if (el) el.style.display = "none";
    activeIndex = -1;
  }, 150);
}

function handleKey(e, sugId, inputId) {
  const sug   = document.getElementById(sugId);
  const items = sug.querySelectorAll(".suggestion-item");

  if (e.key === "ArrowDown") {
    e.preventDefault();
    activeIndex = Math.min(activeIndex + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle("active", i === activeIndex));
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    activeIndex = Math.max(activeIndex - 1, -1);
    items.forEach((el, i) => el.classList.toggle("active", i === activeIndex));
  } else if (e.key === "Enter") {
    if (activeIndex >= 0 && items[activeIndex]) {
      e.preventDefault();
      selectSuggestion(inputId, sugId, items[activeIndex].textContent);
    } else {
      doQuery();
    }
  } else if (e.key === "Escape") {
    sug.style.display = "none";
    activeIndex = -1;
  }
}
